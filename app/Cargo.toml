[package]
name = "clayform-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clayform's Leptos interface (runs in the Tauri window, or any WebGL 2 browser)"

[dependencies]
clayform-core = { path = "../core" }
leptos = { version = "0.8", features = ["csr"] }
wgpu = { version = "24", default-features = false, features = ["webgl", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
base64 = "0.22"
serde_json = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement",
    "HtmlSelectElement", "DomRect", "PointerEvent", "MouseEvent", "WheelEvent", "KeyboardEvent",
    "Event", "EventTarget", "Storage", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement",
    "FileList", "File", "Performance", "CssStyleDeclaration",
] }
