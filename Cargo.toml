[workspace]
resolver = "2"
members = ["core", "app", "src-tauri"]
default-members = ["core"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
