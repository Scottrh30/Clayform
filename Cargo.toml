[package]
name = "clayform"
version = "0.1.0"
edition = "2021"
description = "Digital sculpting app inspired by SculptGL"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
egui = "0.31"
egui-wgpu = "0.31"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[[bin]]
name = "clayform"
path = "src/main.rs"
